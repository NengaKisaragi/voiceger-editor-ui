<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voiceger Editor UI</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span class="leaf">●</span> Voiceger Editor UI</h1>
  <span id="status" class="status">エンジン接続中…</span>
</header>

<main>
  <section class="panel editor">
    <label class="lbl" for="text">セリフ</label>
    <textarea id="text" rows="3" placeholder="ここにセリフを入力するのだ（Ctrl+Enter で生成）"></textarea>

    <details id="kanaBox">
      <summary>読み・アクセント編集 <span class="hint">（日本語のみ）</span></summary>
      <div class="kana-row">
        <input id="kana" type="text" spellcheck="false" placeholder="「読みを取得」で自動入力されます">
        <button id="kanaFetch" class="ghost">読みを取得</button>
        <button id="kanaClear" class="ghost">クリア</button>
      </div>
      <p class="hint">カタカナ＋ <code>'</code>（アクセント位置）、<code>/</code>（句の区切り）。例：<code>ズ'ンダモン/ナノダ</code>　空欄なら自動。</p>
    </details>

    <div class="controls">
      <div class="ctl">
        <label class="lbl">スタイル</label>
        <div id="styles" class="chips"></div>
      </div>
      <div class="ctl-row">
        <div class="ctl">
          <label class="lbl" for="speed">速さ <b id="speedV">1.00</b>x</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
        </div>
        <div class="ctl">
          <label class="lbl" for="takes">テイク数 <b id="takesV">4</b></label>
          <input id="takes" type="range" min="1" max="20" step="1" value="4">
        </div>
      </div>
      <details>
        <summary>詳細パラメータ</summary>
        <div class="ctl-row">
          <div class="ctl">
            <label class="lbl" for="temp">temperature <b id="tempV">1.00</b></label>
            <input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="1">
          </div>
          <div class="ctl">
            <label class="lbl" for="topk">top_k <b id="topkV">20</b></label>
            <input id="topk" type="range" min="1" max="50" step="1" value="20">
          </div>
          <div class="ctl">
            <label class="lbl" for="topp">top_p <b id="toppV">1.00</b></label>
            <input id="topp" type="range" min="0.1" max="1" step="0.05" value="1">
          </div>
        </div>
      </details>
    </div>

    <div class="actions">
      <button id="gen" class="primary">▶ 生成</button>
      <button id="stop" class="ghost" disabled>中止</button>
      <div class="progress"><div id="bar"></div></div>
    </div>

    <h2>候補テイク <span class="hint">↑↓で選択・Spaceで再生・Enterで保存</span></h2>
    <ol id="takeList" class="takes"></ol>
    <p id="takeEmpty" class="empty">まだ候補はないのだ。</p>
  </section>

  <aside class="side">
    <div class="panel mascot-panel">
      <div id="mascot" class="mascot"><img id="mascotImg" alt="ずんだもん"></div>
      <div class="mascot-ctl">
        <label class="lbl" for="fps">コマ速度 <b id="fpsV">6</b>fps</label>
        <input id="fps" type="range" min="1" max="24" step="1" value="6">
        <span id="frameInfo" class="hint"></span>
      </div>
    </div>

    <div class="panel outputs">
      <h2>保存済み <button id="refresh" class="ghost small">更新</button></h2>
      <p id="outDir" class="hint path"></p>
      <ul id="outList"></ul>
    </div>
  </aside>
</main>

<footer>
  生成音声には <a href="https://zunko.jp/con_ongen_kiyaku.html" target="_blank" rel="noopener">Voicegerずんだもん音源利用規約</a> が適用されます。利用前に必ずお読みください（クレジット表記例：Voicegerずんだもん）。
  ／ 非公式UI・エンジン：<a href="https://github.com/sayosomi/voiceger-editor" target="_blank" rel="noopener">Voiceger Editor</a> + <a href="https://github.com/zunzun999/voiceger_v2" target="_blank" rel="noopener">Voiceger</a>
</footer>

<audio id="player"></audio>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
